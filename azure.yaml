# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

name: simple-agent-functions-python
metadata:
  template: simple-agent-functions-python@1.0.0
services:
  api:
    project: ./src
    language: python
    host: function
    hooks:
      # Regenerate requirements.txt from pyproject.toml + uv.lock so uv stays the
      # single source of truth. Runs from the service dir (./src) before packaging.
      prepackage:
        posix:
          shell: sh
          run: uv export --format requirements-txt --no-hashes --no-dev --no-emit-project --output-file requirements.txt
        windows:
          shell: pwsh
          run: uv export --format requirements-txt --no-hashes --no-dev --no-emit-project --output-file requirements.txt
hooks:
  # After provisioning, write src/local.settings.json from the azd environment so
  # `uv run func start` works locally without copying a sample file by hand.
  postprovision:
    posix:
      shell: sh
      run: ./infra/scripts/setuplocalenvironment.sh
      interactive: true
    windows:
      shell: pwsh
      run: ./infra/scripts/setuplocalenvironment.ps1
      interactive: true
